<figure class="radar">
<svg viewBox="0 0 {{ radar.w }} {{ radar.h }}" role="img" aria-label="{{ radar.aria }}">
  {% for ring in radar.rings %}<circle class="rd-ring" fill="none" stroke="#e1ddd2" cx="{{ radar.cx }}" cy="{{ radar.cy }}" r="{{ ring.r }}"/>{% endfor %}
  {% for a in radar.axes %}<line class="rd-axis" stroke="#e1ddd2" x1="{{ radar.cx }}" y1="{{ radar.cy }}" x2="{{ a.x }}" y2="{{ a.y }}"/>{% endfor %}
  {% for ring in radar.rings if ring.label %}<text class="rd-tick" fill="#6d6a62" font-size="9" x="{{ radar.cx + 4 }}" y="{{ radar.cy - ring.r + 10 }}">{{ ring.label }}</text>{% endfor %}
  {% for o in radar.others %}<polygon class="rd-other" fill="none" stroke="#9a978e" stroke-width="1.5" points="{{ o.points }}"><title>{{ o.title }}</title></polygon>{% endfor %}
  <polygon class="rd-main" fill="#1d5c8a" fill-opacity=".12" stroke="#1d5c8a" stroke-width="2" points="{{ radar.main.points }}"><title>{{ radar.aria }}</title></polygon>
  {% for m in radar.main.markers %}<circle class="rd-dot" fill="#1d5c8a" stroke="#fff" stroke-width="2" cx="{{ m.x }}" cy="{{ m.y }}" r="4.5"><title>{{ m.name }}: {{ m.value }}</title></circle>{% endfor %}
  {% for l in radar.labels %}<text class="rd-label" fill="#6d6a62" font-size="11" text-anchor="{{ l.anchor }}">{% for line in l.lines %}<tspan x="{{ l.x }}" y="{{ line.y }}"{% if loop.last %} class="rd-val"{% endif %}>{{ line.text }}</tspan>{% endfor %}</text>{% endfor %}
</svg>
<figcaption class="rd-legend"><span class="rd-key main"></span>chair's final scores{% if radar.others %} · <span class="rd-key other"></span>individual reviewers{% endif %}</figcaption>
</figure>
